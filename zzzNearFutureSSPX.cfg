// Heat Control to System Heat
@PART[heat-exchanger-125-1]:NEEDS[SystemHeat]
{
    @mass = 0.28

    !MODULE[ModuleActiveRadiator],* {}

    MODULE
    {
        name = ModuleSystemHeat
        volume = 1
        moduleID = sink
        iconName = Icon_Snow
        currentLoopID = 1
    }

    MODULE
    {
        name = ModuleSystemHeatSink
        moduleID = sink
        systemHeatModuleID = sink
        maxHeatRate = 1000

        heatStorageMaximum = 2520000
        heatStorageMass = 2000
        heatStorageSpecificHeat = 1.26
    }
}

