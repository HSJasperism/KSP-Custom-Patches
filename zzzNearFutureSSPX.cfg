// Revert Barn Kit Buffs
@CUSTOMBARNKIT:AFTER[OPM]:NEEDS[NearFutureExploration]
{
    @TRACKING
    {
        @levels = 3
        @upgradesVisual = 1, 2, 3
        @upgrades = 38000, 150000, 563000
        @patchesAheadLimit = 0, 2, 4
        @trackedObjectLimit = 0, 8, -1
        @DSNRange = 5000000000, 25000000000, 125000000000
    }
}


