// Pilot Cupola functionality
@PART[sspx-cupola-125-1,sspx-cupola-1875-1,cupola,sspx-cupola-375-1,sspx-dome-cupola-5-1]:FINAL
{
    !MODULE[ModuleScienceExperiment],*:HAS[#experimentID[sspxVisualObservation]] {}
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = sspxVisualObservation
        experimentActionName = Visual Scan
        resetActionName = Discard Visual Scan
        reviewActionName = Review Visual Scan
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        rerunnable = True
        usageReqMaskInternal = 5
        usageReqMaskExternal = -1
        xmitDataScalar = 1.0
    }

	!MODULE[ModuleProbeControlPoint] {}
	MODULE
	{
		name = ModuleProbeControlPoint
		minimumCrew = 1
		multiHop = False
	}

	!MODULE[ModuleKerbNetAccess] {}
	MODULE
	{
		name = ModuleKerbNetAccess
		MinimumFoV = 21
		MaximumFoV = 54
		AnomalyDetection = 0.06
		DISPLAY_MODES
		{
			Mode = Biome,#autoLOC_438890
		}
	}
}