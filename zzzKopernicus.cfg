// Disable Kopernicus support for multi star systems
@PART[*]:HAS[@MODULE[ModuleDeployableSolarPanel]]
{
    %useKopernicusSolarPanels = false
}

// Jool Moons
@Kopernicus:AFTER[OPM]
{
	@Body[Laythe]
	{
		%Orbit
		{
			%referenceBody = Jool
			%argumentOfPeriapsis = 0
			!meanAnomalyAtEpoch = dummy
			%meanAnomalyAtEpochD = 180
			%inclination = 0
		}
	}
	
	@Body[Vall]
	{
		%Properties
		{
			// Offset the change in mean anomally, 0 - 51.5662 degrees
			%initialRotation = 308.4338
		}
		%Orbit
		{
			%referenceBody = Jool
			%argumentOfPeriapsis = 0
			!meanAnomalyAtEpoch = dummy
			%meanAnomalyAtEpochD = 0
			%inclination = 0
		}
	}
	
	@Body[Tylo]
	{
		%Orbit
		{
			%referenceBody = Jool
			%argumentOfPeriapsis = 0
			!meanAnomalyAtEpoch = dummy
			%meanAnomalyAtEpochD = 180
			%inclination = 0
		}
	}
}

@Kopernicus:LAST[JoolBiomes]
{
	@Body[Jool]
	{
		@Properties
		{
			@biomeMap = JoolBiomes/JoolBiome.png
			!BIOMES {}
			Biomes
			{
				Biome
				{
					name = Equatorial Cloud Belt
					value = 1.0
					@color = #2d4416
				}
				Biome
				{
					name = Temperate Cloud Belt
					value = 1.0
					@color = #6f8936
				}
				Biome
				{
					name = Polar Cloud Belt
					value = 1.0
					color = #48642e
				}
			}
		}

        @ScaledVersion
        {		
			@Material
			{
				!texture = JoolBiomes/JoolColor.png
			}				
		}
	}
}