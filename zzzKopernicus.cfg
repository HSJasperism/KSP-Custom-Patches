// Lag Fix
@Kopernicus:FINAL
{
    %useOnDemandBiomes = false
}

// Disable Kopernicus support for multi star systems
@PART[*]:HAS[@MODULE[ModuleDeployableSolarPanel]]:BEFORE[Kopernicus]
{
    %useKopernicusSolarPanels = false
}

// Jool Moons
@Kopernicus:FINAL
{
	// Biome fixes for Eve have a 0 multiplier mistakenly, and has the texture in an unoptimized folder
	@Body[Eve]
	{
		%Properties
		{
			%biomeMap = BiomeCorrections/PluginData/Eve_biomeMap.png
			@Biomes
			{
				@Biome,*
				{
					@value = 1.0
				}
			}
		}
	}

	@Body[Gilly]
	{
		%Orbit
		{
			%semiMajorAxis = 12600000
		}
	}

	@Body[Laythe]
	{
		%Properties
		{
			%sphereOfInfluence = 5776417.888
		}
		%Orbit
		{
			%argumentOfPeriapsis = 0
			%meanAnomalyAtEpochD = 180
			%inclination = 0
			%eccentricity = 0
			%semiMajorAxis = 42170000
		}
	}
	
	@Body[Vall]
	{
		%Properties
		{
			// Offset the change in mean anomaly, 0 - 51.5662 degrees
			%initialRotation = 308.4338
			%sphereOfInfluence = 3732994.929
		}
		%Orbit
		{
			%argumentOfPeriapsis = 0
			%meanAnomalyAtEpochD = 0
			%inclination = 0
			%eccentricity = 0
			%semiMajorAxis = 66940700
		}
	}
	
	@Body[Tylo]
	{
		%Properties
		{
			%sphereOfInfluence = 16841350.835
		}
		%Orbit
		{
			%argumentOfPeriapsis = 0
			%meanAnomalyAtEpochD = 180
			%inclination = 0
			%eccentricity = 0
			%semiMajorAxis = 106261740
		}
	}

	@Body[Bop]
	{
		%Properties
		{
			%sphereOfInfluence = 1602868.065
		}
		%Orbit
		{
			%semiMajorAxis = 168680000
		}
	}

	@Body[Pol]
	{
		%Properties
		{
			%sphereOfInfluence = 1551203.726
		}
		%Orbit
		{
			%semiMajorAxis = 267762810
		}
	}

	@Body[Ovok]
	{
		%Properties
		{
			%sphereOfInfluence = 350464.764
		}
		%Orbit
		{
			%eccentricity = 0.3
			%inclination = 181.5
			%semiMajorAxis = 182541195
		}
	}

	@Body[LintMikey]
	{
		%Orbit
		{
			%argumentOfPeriapsis = 122.78
