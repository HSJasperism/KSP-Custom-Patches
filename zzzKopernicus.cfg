// Lag Fix
@Kopernicus:FINAL
{
    %useOnDemandBiomes = false
}

// Disable Kopernicus support for multi star systems
@PART[*]:HAS[@MODULE[ModuleDeployableSolarPanel]]:BEFORE[Kopernicus]
{
    %useKopernicusSolarPanels = false
}

// Jool Moons
@Kopernicus:FINAL
{
	// Biome fixes for Eve have a 0 multiplier mistakenly, and has the texture in an unoptimized folder
	@Body[Eve]
	{
		@Properties
		{
			@biomeMap = BiomeCorrections/PluginData/Eve_biomeMap.png
			@Biomes
			{
				@Biome,*
				{
					@value = 1.0
				}
			}
		}
	}

	@Body[Laythe]
	{
		%Orbit
		{
			%argumentOfPeriapsis = 0
			%meanAnomalyAtEpochD = 180
			%inclination = 0
		}
	}
	
	@Body[Vall]
	{
		%Properties
		{
			// Offset the change in mean anomaly, 0 - 51.5662 degrees
			%initialRotation = 308.4338
		}
		%Orbit
		{
			%argumentOfPeriapsis = 0
			%meanAnomalyAtEpochD = 0
			%inclination = 0
		}
	}
	
	@Body[Tylo]
	{
		%Orbit
		{
			%argumentOfPeriapsis = 0
			%meanAnomalyAtEpochD = 180
			%inclination = 0
		}
	}
}