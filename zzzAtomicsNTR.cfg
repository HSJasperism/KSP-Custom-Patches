// Nuclear Engine thermal properties
@PART[ntr*,nuclearEngine,restock-engine-cherenkov]:FINAL
{
    %emissiveConstant = 0.85
    %heatConductivity = 0.06
    %skinInternalConductionMult = 4.0
    %thermalMassModifier = 1.0
}

// Nerv Description
@PART[nuclearEngine]:FINAL
{
	@description ^= :only:first:
}

// Aerospike ISPs
@PART[ntr-gc-25-3]:FINAL
{
	@MODULE[ModuleEnginesFX]
	{
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 1250
			key = 1 1170
			key = 10 850
		}
	}
}

