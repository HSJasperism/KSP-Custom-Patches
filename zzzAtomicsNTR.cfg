// Nuclear Engine thermal properties
@PART[ntr*,nuclearEngine,restock-engine-cherenkov]:HAS[!MODULE[FissionEngine]]:FINAL
{
    %emissiveConstant = 0.85
    %heatConductivity = 0.06
    %skinInternalConductionMult = 4.0
    %thermalMassModifier = 1.0
}

// Foil Tank thermal properties
@PART[externalTankToroid,externalTankRound,externalTankCapsule,hydrogen-*,nfex-fueltank-*,truss-octo-01,truss-octo-02,truss-hex-01,truss-hex-02,Size1_5_Lander]:FINAL
{
    %emissiveConstant = 0.95
    %heatConductivity = 0.24
}
