@PART[*]:HAS[@MODULE[FissionGenerator],@MODULE[FissionEngine]]:FINAL
{
	@MODULE[FissionEngine]
	{
		%Priority = 1
	}
	
	@MODULE[FissionGenerator]
	{
		%Priority = 2
	}
}

// Nuclear Engine thermal properties
@PART[ntr*,nuclearEngine,restock-engine-cherenkov]:HAS[!MODULE[FissionEngine]]:FINAL
{
	%emissiveConstant = 0.85
	%heatConductivity = 0.06
	%skinInternalConductionMult = 4.0
	%thermalMassModifier = 1.0
	!MODULE[ModuleActiveRadiator] {}
}

// Foil Tank thermal properties
@PART[externalTankToroid,externalTankRound,externalTankCapsule,hydrogen-*,nfex-fueltank-*,truss-octo-01,truss-octo-02,truss-hex-01,truss-hex-02,Size1_5_Lander]:AFTER[zzz_CryoTanks]
{
	%emissiveConstant = 0.95
	%heatConductivity = 0.24
	!MODULE[ModuleCryoTank] {}
	MODULE
	{
		name = ModuleCryoTank
		CoolingEnabled = True
		BOILOFFCONFIG
		{
			FuelName = LqdHydrogen
			BoiloffRate = 0.050
			CoolingCost = 0.020
		}
		BOILOFFCONFIG
		{
			FuelName = LqdMethane
			BoiloffRate = 0.005
			CoolingCost = 0.010
		}
	}
}

@PART[*]:HAS[@MODULE[ModuleRadioisotopeGenerator]]:FINAL
{
	@MODULE[ModuleRadioisotopeGenerator]
	{
		@HalfLife = 87.74
	}
}

@PART[*]:HAS[@MODULE[MultiModeEngines],@MODULE[ModuleAlternator]]:FINAL
{
	@MODULE[ModuleAlternator]
	{
		%preferMultiMode = true
	}
}