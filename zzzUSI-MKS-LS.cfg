// Centrifuge Habitats
@PART[*]:HAS[@MODULE[ModuleDeployableCentrifuge],!RESOURCE[Supplies]]:NEEDS[USILifeSupport]:FINAL
{
    RESOURCE
    {
        name = Supplies
        amount = 90
        @amount *= #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
        maxAmount = 90
        @maxAmount *= #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
    }

    MODULE
    {
        name = USI_SwapController
    }

    MODULE
    {
        name = USI_SwappableBay
        bayName = Bay 1
        moduleIndex = 0
    }

    MODULE
    {
        name = USI_Converter
        UseSpecialistBonus = false
    }

    MODULE
    {
        name = USILS_HabitationSwapOption
        ConverterName = Quarters
        StartActionName = Enable Quarters
        StopActionName = Disable Quarters

        BaseKerbalMonths = 18
        @BaseKerbalMonths *= #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
        CrewCapacity = #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
        BaseHabMultiplier = 4.0

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 0.20
            @Ratio *= #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
        }
    }

    MODULE
    {
        name = USILS_HabitationSwapOption
        ConverterName = Common Area
        StartActionName = Enable Common Area
        StopActionName = Disable Common Area

        BaseKerbalMonths = 9
        @BaseKerbalMonths *= #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
        CrewCapacity = 2
        @CrewCapacity *= #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
        BaseHabMultiplier = 4.0

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 0.20
            @Ratio *= #$/MODULE[ModuleDeployableCentrifuge]/DeployedCrewCapacity$
        }
    }
}

