@PART[sspx-cupola-greenhouse-125-1,sspx-greenhouse-25-1,sspx-greenhouse-375-1,sspx-greenhouse-5-1,sspx-dome-greenhouse-5-1]:NEEDS[USILifeSupport]:FINAL
{
    MODULE
    {
        name = USI_Converter
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
    }

    MODULE
    {
        name = USI_SwapController
    }

    MODULE
    {
        name = USI_SwappableBay
        bayName = Bay 1
        moduleIndex = 0
    }

    MODULE
    {
        name = USI_ConverterSwapOption
        ConverterName = Growth
        StartActionName = Start Growth
        StopActionName = Stop Growth
		
		UseSpecialistBonus = true
		ExperienceEffect = BotanySkill
		EfficiencyTag = Greenhouse

        INPUT_RESOURCE
        {
            ResourceName = Mulch
            Ratio =  0.00050
            @Ratio *= #$/mass$
        }
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 8.0
            @Ratio *= #$/mass$
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Supplies
            Ratio = 0.00050
            @Ratio *= #$/mass$
            DumpExcess = False
        }
    }

    MODULE
    {
        name = USI_ConverterSwapOption
        ConverterName = Fertilized Growth
        StartActionName = Start Fertilized Growth
        StopActionName = Stop Fertilized Growth
		
		UseSpecialistBonus = true
		ExperienceEffect = BotanySkill
		EfficiencyTag = Greenhouse

        INPUT_RESOURCE
        {
            ResourceName = Mulch
            Ratio =  0.00180
            @Ratio *= #$/mass$
        }
        INPUT_RESOURCE
        {
            ResourceName = Fertilizer
            Ratio =  0.00020
            @Ratio *= #$/mass$
        }
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 8.0
            @Ratio *= #$/mass$
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Supplies
            Ratio = 0.00200
            @Ratio *= #$/mass$
            DumpExcess = False
        }
    }

    MODULE:NEEDS[MKS]
    {
        name = MKSModule
		workSpace = #$/CrewCapacity$
		livingSpace = 0
		hasGenerators = false
    }
}

