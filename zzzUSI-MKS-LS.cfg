// Remove Stock USI Parts (except storage)
@PART[USILS*]:FINAL
{
    %TechHidden = True
    %category = none
    %subcategory = 0
    !VABORGANIZER {}
    !tags = cck-lifesupport
}

// Remove Community Patches
@PART[*]:HAS[@MODULE[USILS_HabitationSwapOption]]:FINAL
{
    !MODULE[USILS_HabitationSwapOption],* {}
    !MODULE[USILS_LifeSupportRecyclerSwapOption],* {}
    !MODULE[USI_ConverterSwapOption],* {}
    !RESOURCE[Supplies] {}
    !RESOURCE[Mulch] {}
    !RESOURCE[Fertilizer] {}
    !MODULE[USI_SwapController],* {}
    !MODULE[USI_SwappableBay],* {}
    !MODULE[USI_Converter],* {}
}

@PART[*]:HAS[@MODULE[USILS_LifeSupportRecyclerSwapOption]]:FINAL
{
    !MODULE[USILS_HabitationSwapOption],* {}
    !MODULE[USILS_LifeSupportRecyclerSwapOption],* {}
    !MODULE[USI_ConverterSwapOption],* {}
    !RESOURCE[Supplies] {}
    !RESOURCE[Mulch] {}
    !RESOURCE[Fertilizer] {}
    !MODULE[USI_SwapController],* {}
    !MODULE[USI_SwappableBay],* {}
    !MODULE[USI_Converter],* {}
}

// Easier Machinery
@RESOURCE_DEFINITION[Machinery]
{
    density = 0.001
}

//
// Custom Life Suport Patches
//

// EAS-1 External Command Seat
@PART[seatExternalCmd]:NEEDS[USILifeSupport]:FINAL
{
    RESOURCE
    {
        name = Supplies
        amount = 15
        maxAmount = 15
    }
}

// Command Pods
@PART[*]:HAS[#CrewCapacity[>0],@MODULE[ModuleCommand],!RESOURCE[Supplies]]:NEEDS[USILifeSupport]:FINAL
{
    RESOURCE
    {
        name = Supplies
        amount = 45
        @amount *= #$/CrewCapacity$
        maxAmount = 45
        @maxAmount *= #$/CrewCapacity$
    }

    MODULE:NEEDS[MKS]
    {
        name = MKSModule
		workSpace = #$/CrewCapacity$
		livingSpace = 0
		hasGenerators = false
    }
}

