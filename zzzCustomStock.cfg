// Stock Engine Tweaks
@PART[Size3AdvancedEngine]
{
	@MODULE[ModuleEnginesFX]
	{
		!atmosphereCurve
		atmosphereCurve
		{
			key = 0 375
			key = 1 225
			key = 5 0.001
		}
	}
}

@PART[toroidalAerospike]
{
	@MODULE[ModuleEnginesFX]
	{
		!atmosphereCurve
		atmosphereCurve
		{
			key = 0 340
			key = 1 290
			key = 10 230
			key = 15 170
			key = 20 0.001
		}
	}
}

@PART[radialLiquidEngine1-2]
{
	@MODULE[FXModuleAnimateThrottle],*
	{
		%preferMultiMode = True
	}
	@MODULE[ModuleAlternator],*
	{
		%preferMultiMode = True
	}
	@MODULE[ModuleEnginesFX]
	{
		%engineID = LF
		%maximumThrust = 180
	}
	+MODULE[ModuleEnginesFX]
	{
		%maximumThrust = 90
		%engineID = MonoProp
		%EngineType = MonoProp
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MonoPropellant
			ratio = 1.0
			DrawGauge = True
		}
		!atmosphereCurve
		atmosphereCurve
		{
			key = 0 315
			key = 1 150
			key = 4 0.001
		}
	}
	MODULE
	{
		name = MultiModeEngine
		primaryEngineID = LF
		primaryEngineModeDisplayName = LF
		secondaryEngineID = MonoProp
		secondaryEngineModeDisplayName = MonoProp
	}
	@MODULE[ModuleSurfaceFX]
	{
		%thrustProviderModuleIndex = 0
	}
	+MODULE[ModuleSurfaceFX]
	{
		%thrustProviderModuleIndex = 1
	}
}

@PART[Size3EngineCluster]:NEEDS[!ReStock]
{
	@EFFECTS
	{
		!running_closed {}
		running_LH
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_spurts
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.2
				pitch = 1.0 1.0
				loop = true
			}
			PREFAB_PARTICLE
			{
				prefabName = fx_smokeTrail_veryLarge
				transformName = smokePoint
				emission = 0.0 0.0
				emission = 0.05 0.0
				emission = 0.075 0.25
				emission = 1.0 1.25
				speed = 0.0 0.25
				speed = 1.0 1.0
				localOffset = 0, 0, 1
			}
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/hydroLOXFlame
				transformName = thrustTransform
				emission = 0.0 0.0
				emission = 0.05 0.0
				emission = 0.075 0.25
				emission = 1.0 1.25
				speed = 0.0 0.5
				speed = 1.0 1.2
				localPosition = 0, 0, -0.08
			}
		}
		running_LF
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_spurts
				volume = 0.0 0.0
				volume = 1.0 1.0
				pitch = 0.0 0.2
				pitch = 1.0 1.0
				loop = true
			}
			PREFAB_PARTICLE
			{
				prefabName = fx_smokeTrail_veryLarge
				transformName = smokePoint
				emission = 0.0 0.0
				emission = 0.05 0.0
				emission = 0.075 0.25
				emission = 1.0 1.25
				speed = 0.0 0.25
				speed = 1.0 1.0
				localOffset = 0, 0, 1
			}
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/ks25_Exhaust
				transformName = thrustTransform
				emission = 0.0 0.0
				emission = 0.05 0.0
				emission = 0.075 0.25
				emission = 1.0 1.25
				speed = 0.0 0.5
				speed = 1.0 1.2
				localPosition = 0, 0, -0.08
			}
		}
	}
}


// Remove the Lifting Surfaces from Non-wing parts
@PART[*]:HAS[@MODULE[ModuleLiftingSurface],@MODULE[ModuleAblator],!MODULE[KerbalEVA]]:NEEDS[FerramAerospaceResearch]
{
	!MODULE[ModuleLiftingSurface] {}
}

@PART[*]:HAS[@MODULE[ModuleLiftingSurface],@MODULE[ModuleCommand],!MODULE[KerbalEVA]]:NEEDS[FerramAerospaceResearch]
{
	!MODULE[ModuleLiftingSurface] {}
}