// Stock Engine Tweaks
@PART[toroidalAerospike]:FINAL
{
	@MODULE[ModuleEnginesFX]
	{
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 340
			key = 1 290
			key = 10 230
		}
	}
}

// Remove the Lifting Surfaces from Non-wing parts
@PART[*]:HAS[@MODULE[ModuleLiftingSurface],!MODULE[KerbalEVA]]:AFTER[FerramAerospaceResearch]
{
	!MODULE[ModuleLiftingSurface],* {}
}

// Communotron 16-S
@PART[SurfAntenna]:FINAL
{
	@MODULE[ModuleDataTransmitter]
	{
		%antennaCombinable = True
		%antennaCombinableExponent = 0.25
	}
}

// Disable Flags by Default
@PART[*]:HAS[@MODULE[FlagDecal],!MODULE[KerbalEVA]]:FINAL
{
	@MODULE[FlagDecal]
    {
        flagDisplayed = false
    }
}

// Probe Upgrades
PARTUPGRADE
{
	name = ProbeSAS_Upgrade
	partIcon = avionicsNoseCone
	techRequired = automation
	title = Probe SAS Upgrade
	basicInfo = Upgrades all probes' SAS capabilities
	description = Adds prograde/retrograde, normal, radial, target, & maneuver SAS to all SAS-capable probes
	entryCost = 25000
}

@PART[*]:HAS[@MODULE[ModuleSAS],#vesselType[Probe]]
{
	@MODULE[ModuleSAS]:HAS[#SASServiceLevel[<3]]
	{
		%showUpgradesInModuleInfo = true
		%UPGRADES
		{
			UPGRADE
			{
				name__ = ProbeSAS_Upgrade
				description__ = Upgraded SAS capabilities			
				SASServiceLevel = 3
			}
		}
	}
}