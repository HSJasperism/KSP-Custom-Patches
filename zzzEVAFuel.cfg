// Fixes for EvaFuel

@PART[sspx-cupola-125-1,sspx-core-125-1,sspx-core-25-1,sspx-core-375-1]:FOR[EvaFuel]
{
	%isHatchless = true
}

@PART[seatExternalCmd]:FOR[EvaFuel]
{
    RESOURCE
	{
		name = MonoPropellant
		amount = 5
		maxAmount = 5
	}
}

@PART[*]:HAS[#CrewCapacity[>0],@MODULE[ModuleCommand],~RESOURCE[MonoPropellant],~isHatchless[true]]:FOR[EvaFuel]
{
	RESOURCE
	{
		name = MonoPropellant
		amount = 20
		@amount *= #$/CrewCapacity$
		maxAmount = 20
		@maxAmount *= #$/CrewCapacity$
	}
}

@PART[*]:HAS[#CrewCapacity[>0],@MODULE[ModuleCommand],@RESOURCE[MonoPropellant]]:FOR[EvaFuel]
{
	MODULE
	{
		name = ModuleEVAFuel
		evaFuelResource = MonoPropellant
	}
}

@PART[*]:HAS[#isHatchless]:FINAL
{
	!isHatchless
}

// Hatches w/ possible EVA

@PART[sspx-airlock-125-1]:NEEDS[EvaFuel]
{
    %mass = 0.03
    Resource
    {
        name = MonoPropellant
        amount = 50
        maxAmount = 50
    }

    MODULE
	{
		name = ModuleEVAFuel
		evaFuelResource = MonoPropellant
	}
}

@PART[sspx-airlock-25-1]:NEEDS[EvaFuel]
{
    @mass -= 0.54
    Resource
    {
        name = MonoPropellant
        amount = 135
        maxAmount = 135
    }

    MODULE
	{
		name = ModuleEVAFuel
		evaFuelResource = MonoPropellant
	}
}

@PART[KKAOSS_gangway_airlock,KKAOSS_airlock_end_g,KKAOSS_airlock_mid_g]:NEEDS[EvaFuel]
{
    %mass = 0.03
    Resource
    {
        name = MonoPropellant
        amount = 50
        maxAmount = 50
    }

    MODULE
	{
		name = ModuleEVAFuel
		evaFuelResource = MonoPropellant
	}
}
