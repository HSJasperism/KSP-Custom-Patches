// Disable Reference Parts
@PART[RC_cone,RC_cone_double,RC_radial,RC_stack]:FINAL
{
    %TechHidden = True
    %category = none
    %subcategory = 0
    %tags = deprecated
    !VABORGANIZER {}
    !MODULE[RealChuteModule] {}
    !MODULE[ProceduralChute] {}
}

@PART[radialDrogue,parachuteRadial]:FINAL
{
    @MODULE[RealChuteModule]
    {
        @PARACHUTE
        {
            %forcedOrientation = 30
        }
    }
}