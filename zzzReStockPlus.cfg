// Restock Engines
@PART[restock-engine-torch]:AFTER[ReStockPlus]
{
	%heatConductivity = 0.06
	%skinInternalConductionMult = 4.0
	%emissiveConstant = 0.8
	@MODULE[ModuleEnginesFX]
	{
		%heatProduction = 44
	}
}

