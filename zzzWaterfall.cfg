// Fixes for Waterfall configs
// Swivel
@PART[liquidEngine2_v2]:AFTER[RestockWaterfallExpansion]
{
    @MODULE[ModuleWaterfallFX]
    {
        @TEMPLATE:HAS[#templateName[waterfall-kerolox-lower-4-SWE]]
        {
            @position = 0, 0, 0.56
        }

        @TEMPLATE:HAS[#templateName[stock-kerolox-core]]
        {
            @position = 0, 0, 0.56
        }
    }
}

// Skiff
@PART[LiquidEngineRE-I2]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-upper-1]]
        {
            @position = 0, 0, -0.9
        }

        RANDOMNESSCONTROLLER
        {
            name = RandomFast1
            noiseType = perlin
            scale = 1
            minimum = 0
            speed = 8
            seed = 40
        }
    }    
}

// Rhino
@PART[Size3AdvancedEngine]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleWaterfallFX]
    {
        @TEMPLATE:HAS[#templateName[stock-hydrolox-upper-1]]
        {
            @position = 0, 0, 0.25
        }
    }
}

// Bobcat
@PART[LiquidEngineLV-TX87]:AFTER[RestockWaterfallExpansion]
{
    @MODULE[ModuleWaterfallFX]
    {
        @TEMPLATE[plume]
        {
            @templateName = waterfall-hypergolic-aerozine50-lower-1
        }

        RANDOMNESSCONTROLLER
        {
            name = random
            noiseType = perlin
            scale = 1
            minimum = 0
            speed = 4
            seed = 40
        }
    }

    @MODULE[ModuleB9PartSwitch]
    {
        @SUBTYPE[hydroloxBobcat]
        {
            @MODULE
            {
                @DATA
                {
                    @TEMPLATE[core]
                    {
                        @position = 0, 0, -0.15
                    }
                }
            }
        }

        @SUBTYPE[keroloxBobcat]
        {
            @MODULE
            {
                @DATA
                {
                    @TEMPLATE[plume]
                    {
                        @rotation = 0, 0, 90
                    }
                }
            }
        }
    }
}

// Cheetah
@PART[LiquidEngineLV-T91]:AFTER[RestockWaterfallExpansion]
{
    @MODULE[ModuleB9PartSwitch]
    {
        @switchInFlight = false
    }
}

// Vector
@PART[SSME]:AFTER[StockWaterfallEffects]
{
    @MODULE[ModuleB9PartSwitch]
    {
        @switchInFlight = false
    }
}