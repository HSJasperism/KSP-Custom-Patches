//
// Supply Storage
//

// EAS-1 External Command Seat
@PART[seatExternalCmd]:NEEDS[USILifeSupport]:FINAL
{
	RESOURCE
	{
		name = Supplies
		amount = 5
		maxAmount = 5
	}
	
	@mass -= 0.005
}

// Passenger Cabins
@PART[MK1CrewCabin,mk2CrewCabin,mk3CrewCabin,crewCabin,sspx-habitation-375-3]:NEEDS[USILifeSupport]:FINAL
{
	RESOURCE
	{
		name = Supplies
		amount = 25
		@amount *= #$/CrewCapacity$
		maxAmount = 25
		@maxAmount *= #$/CrewCapacity$
	}
	
	massOffsetSupplies = #$/CrewCapacity$
	@massOffsetSupplies *= 0.025
	@mass -= #$/massOffsetSupplies$
	!massOffsetSupplies = dummy
}

