//
// Custom Life Suport Patches
//

// 1.25 dome, 2.5, 3.75, 5, 5 dome
@PART[sspx-cupola-greenhouse-125-1,sspx-greenhouse-25-1,sspx-greenhouse-375-1,sspx-greenhouse-5-1,sspx-dome-greenhouse-5-1,Benjee10_MMSEV_baseGreenhouse]:NEEDS[USILifeSupport]:FINAL
{
	MODULE
	{
		name = USI_Converter
		UseSpecialistBonus = false
	}

	MODULE
	{
		name = USI_SwapController
	}

	MODULE
	{
		name = USI_SwappableBay
		bayName = Bay 1
		moduleIndex = 0
	}

	MODULE
	{
		name = USI_ConverterSwapOption
		ConverterName = Agriculture
		StartActionName = Start Agriculture
		StopActionName = Stop Agriculture

		INPUT_RESOURCE
		{
			ResourceName = Mulch
			Ratio =  0.00010425
			@Ratio *= #$/mass$
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 24.0
			@Ratio *= #$/mass$
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Supplies
			Ratio = 0.00010425
			@Ratio *= #$/mass$
			DumpExcess = False
		}
	}

	MODULE
	{
		name = USI_ConverterSwapOption
		ConverterName = Hydroponics
		StartActionName = Start Hydroponics
		StopActionName = Stop Hydroponics

		INPUT_RESOURCE
		{
			ResourceName = Mulch
			Ratio =  0.00020000
			@Ratio *= #$/mass$
		}
		INPUT_RESOURCE
		{
			ResourceName = Fertilizer
			Ratio =  0.00000900
			@Ratio *= #$/mass$
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 24.0
			@Ratio *= #$/mass$
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Supplies
			Ratio = 0.00020900
			@Ratio *= #$/mass$
			DumpExcess = False
		}
	}

	RESOURCE
	{
		name = Mulch
		amount = 0
		maxAmount = 100
		@maxAmount *= #$/mass$
	}

	RESOURCE
	{
		name = Supplies
		amount = 100
		@amount *= #$/mass$
		maxAmount = 100
		@maxAmount *= #$/mass$
	}
}

