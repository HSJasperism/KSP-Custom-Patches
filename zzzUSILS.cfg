// Revised Fertilizer in ISRUs

@PART[ISRU]:NEEDS[USILifeSupport]:FINAL
{
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Fertilizer
		StartActionName = Start ISRU [Fertilizer]
		StopActionName = Stop ISRU [Fertilizer]
		ToggleActionName = Toggle ISRU [Fertilizer]
		AutoShutdown = true
		GeneratesHeat = true
		DefaultShutoffTemp = .8
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1000 10000
			key = 1250 500
			key = 2000 50
			key = 4000 0
		}
		ThermalEfficiency
		{
			key = 0 0 0 0
			key = 500 0.1 0 0
			key = 1000 1.0 0 0
			key = 1250 0.1 0 0
			key = 3000 0 0 0
		}
		INPUT_RESOURCE
		{
			ResourceName = Ore
			Ratio = 1.0
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 0.1
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 50
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Fertilizer
			Ratio = 0.25
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}
}

@PART[MiniISRU]:NEEDS[USILifeSupport]:FINAL
{
	@MODULE[ModuleResourceConverter],*:HAS[ConverterName[Fertilizer]]
