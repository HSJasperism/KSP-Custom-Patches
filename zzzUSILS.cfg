//
// Supply Storage
//

// EAS-1 External Command Seat
@PART[seatExternalCmd]:NEEDS[USILifeSupport]:FINAL
{
	RESOURCE
	{
		name = Supplies
		amount = 5
		maxAmount = 5
	}
	
	@mass -= 0.005
}

// Command Pods
@PART[*]:HAS[#CrewCapacity[>0],@MODULE[ModuleCommand],!RESOURCE[Supplies]]:NEEDS[USILifeSupport]:FINAL
{
	RESOURCE
	{
		name = Supplies
		amount = 25
		@amount *= #$/CrewCapacity$
		maxAmount = 25
		@maxAmount *= #$/CrewCapacity$
	}
	
	massOffsetSupplies = #$/CrewCapacity$
	@massOffsetSupplies *= 0.025
	@mass -= #$/massOffsetSupplies$
	!massOffsetSupplies = dummy
}

// Deployable Habitats
@PART[*]:HAS[@MODULE[ModuleDeployableHabitat],!RESOURCE[Supplies]]:NEEDS[USILifeSupport]:FINAL
{
	RESOURCE
	{
		name = Supplies
		amount = 50
		@amount *= #$/MODULE[ModuleDeployableHabitat]/DeployedCrewCapacity$
		maxAmount = 50
		@maxAmount *= #$/MODULE[ModuleDeployableHabitat]/DeployedCrewCapacity$
	}
	
	massOffsetSupplies = #$/MODULE[ModuleDeployableHabitat]/DeployedCrewCapacity$
	@massOffsetSupplies *= 0.050
	@mass -= #$/massOffsetSupplies$
	!massOffsetSupplies = dummy
}

