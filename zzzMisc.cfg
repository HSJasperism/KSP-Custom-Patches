// Disable MechJeb and Kerbal Engineer parts
@PART[EngineerChip,Engineer7500,mumech*,RC_cone,RC_cone_double,RC_radial,RC_stack]
{
    %TechHidden = True
    %category = none
    %subcategory = 0
    %tags = deprecated
    !VABORGANIZER {}
}

@RESOURCE_DEFINITION[LqdMethane]
{
    %displayName = Liquid Methane
}

@RESOURCE_DEFINITION[DepletedFuel]
{
    %displayName = Depleted Fuel
}

@RESOURCE_DEFINITION[Supplies,Mulch,Fertilizer]
{
    %flowMode = STACK_PRIORITY_SEARCH
}

@AGENCY[RealChute,SCAN]
{
    mentality = NoRandomContractMentality
}


// Config for SCANsat Parts
@PART[SCANsat_Scanner24|scansat-multi-modis-1|scansat-multi-abi-1|scansat-multi-msi-1]:NEEDS[SCANsat]
{
    %VABORGANIZER
    {
        %organizerSubcategory = ScanMulti
    }
}
@PART[SCANsat_Scanner|SCANsat_Scanner2|scansat-radar-poseidon-3b-1|scansat-radar-seasat-1|scansat-sar-paz-1|scansat-sar-radarsat-2-1|scansat-sar-tandem-l-1]:NEEDS[SCANsat]
{
    %VABORGANIZER
    {
        %organizerSubcategory = ScanAltimetry
    }
}
@PART[SCANsat_Scanner32|SCANsat_Tracker|scansat-exomars-1|scansat-recon-ikonos-1|scansat-recon-worldview-3-1|scansat-recon-kh11-1]:NEEDS[SCANsat]
{
    %VABORGANIZER
    {
        %organizerSubcategory = ScanVisual
    }
}
@PART[scansat-resources-crism-1|scansat-resources-mise-1|scansat-resources-hyperion-1]:NEEDS[SCANsat]
{
    %VABORGANIZER
    {
        %organizerSubcategory = resourceScanners
    }
}