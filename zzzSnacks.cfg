@PART[Large_Crewed_Lab]:AFTER[Snacks]
{
	@RESOURCE[Snacks]
	{
		@amount = #$/CrewCapacity$
		@amount *= 100
		@maxAmount = #$/CrewCapacity$
		@maxAmount *= 100
	}

	RESOURCE
	{
		name = Soil
		amount = 0
		maxAmount = #$/CrewCapacity$
		@maxAmount *= 100
	}

	-MODULE[SnackProcessor] {}
}

// Offset Snack Mass
@PART[*]:HAS[#CrewCapacity[>0],@RESOURCE[Snacks]]:NEEDS[Snacks]:FINAL
{
	maxSnackmass = #$/RESOURCE[Snacks]/maxAmount$
	@maxSnackmass *= 0.001
	@mass -= #$/maxSnackmass$
}

// Balance Snack Tin
@PART[radialSnackTin]:AFTER[Snacks]
{
	@mass = 0.015
}

// Alternate KKAOSS implementation
@PART[crewCabin,mk3Cockpit_Shuttle,mk2CrewCabin]:AFTER[Snacks]
{
	!RESOURCE[Soil] {}
	RESOURCE
	{
		name = Soil
		Amount = 0
		maxAmount = #$/RESOURCE[Snacks]/maxAmount$
	}
	
	!MODULE[SoilRecycler] {}
}

@PART[KKAOSS_Greenhouse_g]:AFTER[PlanetarySurfaceStructures]:NEEDS[Snacks]
{
	@TechRequired = advScienceTech

	@RESOURCE[Soil]
	{
		@maxAmount = #$/RESOURCE[Snacks]/maxAmount$
	}
	
	-MODULE[PlanetaryGreenhouse] {}
	MODULE
	{
		name = SnackProcessor
		ConverterName = #LOC_KPBS.greenhouseconverter.name
		StartActionName = #LOC_KPBS.greenhouseconverter.start
		StopActionName = #LOC_KPBS.greenhouseconverter.stop
		AutoShutdown = false
		GeneratesHeat = false

		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		UseSpecialistHeatBonus = true
		ExperienceEffect = ScienceSkill
		EfficiencyBonus = 1
		
		INPUT_RESOURCE
		{
			ResourceName = Soil
			Ratio = 0.0025
			FlowMode = STAGE_PRIORITY_FLOW
  		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 12
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Snacks
			Ratio = 0.0025
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}
}

